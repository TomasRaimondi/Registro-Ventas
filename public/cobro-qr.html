<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobrar con QR</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cobro-qr.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>Cobrar con QR</h1>
  </div>
  <div class="topbar-actions">
    <a href="/" class="link-btn">Registro de Ventas</a>
    <a href="/pagos.html" class="link-btn">Pagos recibidos</a>
  </div>
</header>

<main class="cobro-qr-main">

  <section class="card cobro-qr-card" id="vista-monto">
    <h2>¿Cuánto hay que cobrar?</h2>
    <form id="monto-form" autocomplete="off">
      <div class="cobro-qr-input-wrap">
        <span>$</span>
        <input type="number" id="monto-input" inputmode="decimal" min="0" step="0.01" placeholder="0" autofocus required>
      </div>
      <button type="submit" class="submit-btn cobro-qr-btn" id="generar-btn">Generar QR</button>
      <p class="hint error-hint" id="monto-error" style="display:none;"></p>
    </form>
  </section>

  <section class="card cobro-qr-card" id="vista-qr" style="display:none;">
    <p class="hint">Mostrale esto al cliente para que lo escanee con la cámara</p>
    <div class="cobro-qr-monto" id="qr-monto">$0</div>
    <img id="qr-imagen" class="cobro-qr-imagen" alt="Código QR de cobro">
    <button type="button" class="submit-btn cobro-qr-btn" id="nuevo-cobro-btn">Nuevo cobro</button>
  </section>

</main>

<script src="cobro-qr.js"></script>
</body>
</html>
