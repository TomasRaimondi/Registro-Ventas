<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envíos Uber Moto</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>Envíos Uber Moto</h1>
  </div>
  <div class="topbar-actions">
    <a href="/" class="link-btn">Registro de Ventas</a>
    <a href="/ganancias.html" class="link-btn">Panel de Ganancias</a>
    <button id="logout-btn" class="clear-btn" style="display:none;">Cerrar sesión</button>
  </div>
</header>

<main class="layout-single layout-wide">

  <!-- Login -->
  <section class="card login-card" id="login-card">
    <h2>Acceso privado</h2>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn">Entrar</button>
      <p class="hint error-hint" id="login-error" style="display:none;">Contraseña incorrecta.</p>
    </form>
  </section>

  <!-- Contenido protegido -->
  <div id="app-content" style="display:none;">

    <section class="metrics-single" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:20px;">
      <div class="card metric-card">
        <span class="label">Envíos últimos 7 días</span>
        <span class="big-number" id="stat-7dias" style="color:var(--purple);">0</span>
      </div>
      <div class="card metric-card">
        <span class="label">Envíos últimos 30 días</span>
        <span class="big-number" id="stat-30dias" style="color:var(--purple);">0</span>
      </div>
      <div class="card metric-card">
        <span class="label">Costo en viajes (30 días)</span>
        <span class="big-number" id="stat-costo-30dias">$0</span>
      </div>
    </section>

    <section class="card">
      <div class="periodo-tabs" id="resumen-periodo-tabs">
        <button type="button" class="periodo-tab active" data-periodo="7dias">7 días</button>
        <button type="button" class="periodo-tab" data-periodo="30dias">30 días</button>
        <button type="button" class="periodo-tab" data-periodo="semana">Semana</button>
        <button type="button" class="periodo-tab" data-periodo="mes">Mes</button>
      </div>
      <h2 id="resumen-titulo">Envíos por día (últimos 7 días)</h2>
      <div class="chart chart-tall" id="envios-chart"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th id="th-periodo">Día</th><th>Cantidad</th><th>Costo total</th><th>Costo promedio</th></tr>
          </thead>
          <tbody id="resumen-body"><tr class="empty-row"><td colspan="4">Cargando...</td></tr></tbody>
        </table>
      </div>
    </section>

  </div>

</main>

<script src="envios.js"></script>
</body>
</html>
