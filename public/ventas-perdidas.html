<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas Perdidas</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1420">
<link rel="apple-touch-icon" href="/logo-platense-fit.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Platense Fit">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"));}</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>Ventas Perdidas</h1>
  </div>
  <div class="topbar-actions">
    <a href="/" class="link-btn">Registro de Ventas</a>
    <a href="/ganancias.html" class="link-btn">Panel de Ganancias</a>
    <button id="logout-btn" class="clear-btn" style="display:none;">Cerrar sesión</button>
  </div>
</header>

<main class="layout-single layout-wide">

  <!-- Login -->
  <section class="card login-card" id="login-card">
    <h2>Acceso privado</h2>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn">Entrar</button>
      <p class="hint error-hint" id="login-error" style="display:none;">Contraseña incorrecta.</p>
    </form>
  </section>

  <!-- Contenido protegido -->
  <div id="app-content" style="display:none;">

    <section class="metrics-single" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:20px;">
      <div class="card metric-card">
        <span class="label">Ventas perdidas ese día</span>
        <span class="big-number" id="stat-total" style="color:var(--red);">0</span>
      </div>
    </section>

    <section class="card">
      <div class="periodo-tabs" id="resumen-periodo-tabs">
        <button type="button" class="periodo-tab" data-periodo="dia">Día</button>
        <button type="button" class="periodo-tab active" data-periodo="semana">Semana</button>
        <button type="button" class="periodo-tab" data-periodo="mes">Mes</button>
      </div>
      <h2 id="resumen-titulo">Ventas perdidas por semana</h2>
      <div class="chart chart-tall" id="resumen-chart"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th id="th-periodo">Semana</th><th>Cantidad</th><th>Motivo más común</th></tr></thead>
          <tbody id="resumen-body"><tr class="empty-row"><td colspan="3">Cargando...</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="history-header">
        <h2>Ventas perdidas de <span id="fecha-label">hoy</span></h2>
        <div class="history-actions">
          <input type="date" id="fecha-input" title="Ver otro día">
          <button type="button" id="hoy-btn" class="clear-btn" style="display:none;">Volver a hoy</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Hora</th><th>Motivo</th><th></th></tr>
          </thead>
          <tbody id="lista-body">
            <tr class="empty-row"><td colspan="3">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

</main>

<script src="ventas-perdidas.js"></script>
</body>
</html>
